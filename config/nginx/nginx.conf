# Nginx  Reverse proxy configuration
#  Used for production deployment of AgentCore intelligent customer service system

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    #  Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip  Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    #  Upstream server configuration
    upstream agentcore_backend {
        least_conn;
        server agentcore:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    #  Current limiting configuration
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # HTTP  Server configuration
    server {
        listen 80;
        server_name localhost;

        #  Redirect to HTTPS (Production environment)
        # return 301 https://$server_name$request_uri;

        # Safety head
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # API  Routing.FastAPI  The real interface does not have the /api prefix, So here proxies all paths that are not individually matched,
        # Guarantee/chat,/search,/knowledge/*,/eval/run  and Swagger Try it out are both available.
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://agentcore_backend;
            proxy_http_version 1.1;

            #  Proxy header settings
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            #  Timeout setting
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            #  Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        #  Health Check Endpoint
        location /health {
            proxy_pass http://agentcore_backend/health;
            access_log off;
        }

        # Prometheus  Metric endpoint
        location /metrics {
            proxy_pass http://agentcore_backend/metrics;
            #  Restrict access
            allow 127.0.0.1;
            allow 172.28.0.0/16;  # Docker Network
            deny all;
        }

        # Static file service
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Swagger UI
        location /docs {
            proxy_pass http://agentcore_backend/docs;
        }

        location /redoc {
            proxy_pass http://agentcore_backend/redoc;
        }

        location /openapi.json {
            proxy_pass http://agentcore_backend/openapi.json;
        }

    }

    # HTTPS  Server configuration ( Production environment)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL  Certificate configuration
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # SSL  Session Cache
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS ( Optional)
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     #  Other configurations are the same as HTTP
    #     # ...
    # }
}
